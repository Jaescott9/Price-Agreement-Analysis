<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPT Agreements — Category by Route & Org</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1e2328;
    --ink-soft: #5b6470;
    --line: #e2e4e2;
    --line-strong: #c9cdc9;
    --accent: #2f5233;
    --accent-soft: #e8efe9;

    --c1: #e03131; /* Multiple CT amounts — hardest to update */
    --c2: #f2b705; /* One CT Empty */
    --c3: #f2b705; /* One CT Loaded */
    --c4: #e8590c; /* One of each */
    --c5: #2f9e44; /* Only PA amount(s) — easiest to update */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "IBM Plex Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px;}

  header.page{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    border-bottom:1px solid var(--line-strong);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  header.page h1{
    font-size:20px;
    font-weight:650;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header.page p{
    margin:0;
    color:var(--ink-soft);
    font-size:13px;
    max-width:60ch;
  }
  .totals{
    display:flex;
    gap:22px;
    text-align:right;
  }
  .totals .stat{
    min-width:74px;
  }
  .totals .stat .n{
    font-size:20px;
    font-weight:650;
    font-variant-numeric: tabular-nums;
  }
  .totals .stat .l{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  select, input[type=text]{
    font-family:inherit;
    font-size:13px;
    padding:7px 10px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    background:var(--panel);
    color:var(--ink);
    min-width:180px;
    max-width:240px;
  }
  select{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  input[type=text]{min-width:220px; max-width:260px;}
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .cat-legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-left:auto;
  }
  .cat-chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border:1px solid var(--line-strong);
    border-radius:999px;
    background:var(--panel);
    font-size:12px;
    cursor:pointer;
    user-select:none;
    color:var(--ink-soft);
  }
  .cat-chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
  .cat-chip.active{
    border-color:var(--ink);
    color:var(--ink);
    background:var(--accent-soft);
  }
  .reset-btn{
    font-size:12px;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--line-strong);
    border-radius:6px;
    padding:7px 12px;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--ink);color:var(--ink);}
  .export-btn{
    font-size:12px;
    color:#fff;
    background:var(--accent);
    border:1px solid var(--accent);
    border-radius:6px;
    padding:7px 12px;
    cursor:pointer;
  }
  .export-btn:hover{opacity:.9;}
  .export-btn:disabled{opacity:.5; cursor:default;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }

  table.matrix{
    width:100%;
    min-width:1260px;
    border-collapse:collapse;
    table-layout:fixed;
  }
  table.matrix thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    font-weight:600;
    padding:10px 12px;
    border-bottom:1px solid var(--line-strong);
    background:#fbfbfa;
    position:sticky;
    top:0;
    cursor:pointer;
    white-space:nowrap;
  }
  table.matrix thead th.num{text-align:right;}
  table.matrix thead th.sort-active{color:var(--ink);}
  table.matrix thead th .arrow{font-size:10px;margin-left:3px;color:var(--ink-soft);}

  table.matrix tbody tr{
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  table.matrix tbody tr:hover{background:#fafaf8;}
  table.matrix tbody tr.expanded{background:var(--accent-soft);}
  table.matrix td{
    padding:9px 12px;
    vertical-align:top;
  }
  td.org{font-weight:600; word-break:break-word;}
  td.route{color:var(--ink); word-break:break-word;}
  td.num{text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap;}
  td.bar-cell{min-width:180px;}

  .stackbar{
    display:flex;
    height:14px;
    border-radius:3px;
    overflow:hidden;
    background:#eee;
    width:100%;
  }
  .stackbar span{display:block; height:100%;}

  .cat-counts{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .cat-counts .item{display:flex;align-items:center;gap:4px;}
  .cat-counts .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  tr.detail-row td{
    background:#fbfbfa;
    padding:0 12px 14px 12px;
    cursor:default;
  }
  .detail-inner{
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  table.legs{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  table.legs th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--ink-soft);
    padding:5px 8px;
    border-bottom:1px solid var(--line);
  }
  table.legs th.num, table.legs td.num{text-align:right;}
  table.legs td{padding:6px 8px; border-bottom:1px solid #eee; vertical-align:top;}
  .cat-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
  }
  .cat-pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .agr-list{
    color:var(--ink-soft);
    font-size:11px;
    max-width:420px;
  }
  .agr-toggle{
    color:var(--accent);
    cursor:pointer;
    font-size:11px;
    text-decoration:underline;
    text-underline-offset:2px;
  }

  .empty-state{
    padding:40px;
    text-align:center;
    color:var(--ink-soft);
  }

  .footnote{
    margin-top:14px;
    font-size:11.5px;
    color:var(--ink-soft);
  }

  @media (max-width: 720px){
    header.page{flex-direction:column; align-items:flex-start;}
    .totals{width:100%; justify-content:space-between;}
    .cat-legend{margin-left:0;}
    table.matrix{font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div>
      <h1>SPT agreements — category by route &amp; org</h1>
      <p>Every org / route combination in the SPT dataset, broken down by pricing category. Click a row for the leg-level detail and agreement numbers.</p>
    </div>
    <div class="totals" id="totals"></div>
  </header>

  <div class="controls">
    <div class="field">
      <label for="orgSelect">Org</label>
      <select id="orgSelect"><option value="">All orgs</option></select>
    </div>
    <div class="field">
      <label for="routeSelect">Route</label>
      <select id="routeSelect"><option value="">All routes</option></select>
    </div>
    <div class="field">
      <label for="legSelect">Leg</label>
      <select id="legSelect"><option value="">All legs</option></select>
    </div>
    <div class="field">
      <label for="searchBox">Search</label>
      <input type="text" id="searchBox" placeholder="Org, route or leg…">
    </div>
    <div class="cat-legend" id="catLegend"></div>
    <button class="reset-btn" id="resetBtn">Reset filters</button>
    <button class="export-btn" id="exportBtn">Export filtered data (.xlsx)</button>
  </div>

  <div class="panel">
    <div style="overflow-x:auto;">
    <table class="matrix" id="matrixTable">
      <colgroup>
        <col style="width:80px">
        <col style="width:230px">
        <col style="width:230px">
        <col style="width:110px">
        <col style="width:110px">
        <col style="width:110px">
        <col style="width:100px">
        <col style="width:110px">
        <col style="width:80px">
        <col style="width:100px">
      </colgroup>
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="matrixBody"></tbody>
    </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">No org / route combinations match the current filters.</div>
  </div>

  <div class="footnote" id="footnote"></div>

</div>

const CATEGORIES = ["Multiple CT amounts", "One CT Empty", "One CT Loaded", "One of each", "Only PA amount(s)"];
const CAT_COLOR = {
  "Multiple CT amounts": "var(--c1)",
  "One CT Empty": "var(--c2)",
  "One CT Loaded": "var(--c3)",
  "One of each": "var(--c4)",
  "Only PA amount(s)": "var(--c5)"
};

// ---- Aggregate raw rows into Org+Route groups ----
function buildGroups(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = r.org + "\u0001" + r.routes;
    if(!map.has(key)){
      map.set(key, {
        org: r.org, route: r.routes,
        catTotals: Object.fromEntries(CATEGORIES.map(c=>[c,0])),
        total: 0, updatable: 0, notUpdatable: 0,
        legs: []
      });
    }
    const g = map.get(key);
    g.catTotals[r.category] = (g.catTotals[r.category]||0) + r.total;
    g.total += r.total;
    g.updatable += r.updatable;
    g.notUpdatable += r.not_updatable;
    g.legs.push(r);
  });
  return Array.from(map.values());
}

const GROUPS = buildGroups(RAW);

function atomicLegs(legStr){
  return legStr.split('|').map(s=>s.trim()).filter(Boolean);
}
const ALL_LEGS = uniqueSortedArr(RAW.flatMap(r=>atomicLegs(r.legs)));
function uniqueSortedArr(arr){ return Array.from(new Set(arr)).sort((a,b)=>a.localeCompare(b)); }

// ---- State ----
const state = {
  org: "",
  route: "",
  leg: "",
  search: "",
  activeCats: new Set(), // empty = all shown
  sortKey: "total",
  sortDir: "desc",
  expanded: new Set()
};

// ---- Populate dropdowns (cascading: org narrows route, org+route narrows leg) ----
const orgSelect = document.getElementById('orgSelect');
const routeSelect = document.getElementById('routeSelect');
const legSelect = document.getElementById('legSelect');
const searchBox = document.getElementById('searchBox');

function uniqueSorted(arr){ return Array.from(new Set(arr)).sort((a,b)=>a.localeCompare(b)); }

uniqueSorted(GROUPS.map(g=>g.org)).forEach(o=>{
  const opt = document.createElement('option'); opt.value=o; opt.textContent=o;
  orgSelect.appendChild(opt);
});

function rebuildRouteOptions(){
  const rows = RAW.filter(r=> !state.org || r.org === state.org);
  const routes = uniqueSorted(rows.map(r=>r.routes));
  const prev = state.route;
  routeSelect.innerHTML = '<option value="">All routes</option>';
  routes.forEach(r=>{
    const opt = document.createElement('option'); opt.value=r; opt.textContent=r;
    routeSelect.appendChild(opt);
  });
  if(prev && routes.includes(prev)){
    routeSelect.value = prev;
  } else {
    state.route = "";
    routeSelect.value = "";
  }
}

function rebuildLegOptions(){
  const rows = RAW.filter(r=> (!state.org || r.org === state.org) && (!state.route || r.routes === state.route));
  const legs = uniqueSortedArr(rows.flatMap(r=>atomicLegs(r.legs)));
  const prev = state.leg;
  legSelect.innerHTML = '<option value="">All legs</option>';
  legs.forEach(l=>{
    const opt = document.createElement('option'); opt.value=l; opt.textContent=l;
    legSelect.appendChild(opt);
  });
  if(prev && legs.includes(prev)){
    legSelect.value = prev;
  } else {
    state.leg = "";
    legSelect.value = "";
  }
}

rebuildRouteOptions();
rebuildLegOptions();

orgSelect.addEventListener('change', e=>{
  state.org = e.target.value;
  rebuildRouteOptions();
  rebuildLegOptions();
  render();
});
routeSelect.addEventListener('change', e=>{
  state.route = e.target.value;
  rebuildLegOptions();
  render();
});
legSelect.addEventListener('change', e=>{ state.leg = e.target.value; render(); });
searchBox.addEventListener('input', e=>{ state.search = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.org=""; state.route=""; state.leg=""; state.search=""; state.activeCats.clear();
  orgSelect.value=""; searchBox.value="";
  rebuildRouteOptions();
  rebuildLegOptions();
  render();
});

// ---- Category legend ----
const legend = document.getElementById('catLegend');
CATEGORIES.forEach(cat=>{
  const chip = document.createElement('div');
  chip.className = 'cat-chip';
  chip.innerHTML = `<span class="dot" style="background:${CAT_COLOR[cat]}"></span>${cat}`;
  chip.addEventListener('click', ()=>{
    if(state.activeCats.has(cat)) state.activeCats.delete(cat);
    else state.activeCats.add(cat);
    render();
  });
  chip.dataset.cat = cat;
  legend.appendChild(chip);
});

// ---- Header row ----
const headerRow = document.getElementById('headerRow');
const columns = [
  {key:'org', label:'Org'},
  {key:'route', label:'Route'},
  {key:'breakdown', label:'Category breakdown', sortable:false},
  ...CATEGORIES.map(c=>({key:c, label:shortLabel(c), num:true})),
  {key:'total', label:'Total', num:true},
  {key:'pct', label:'% Updatable', num:true}
];
function shortLabel(c){
  return c.replace('amounts','amt').replace('amount(s)','amt(s)');
}
columns.forEach(col=>{
  const th = document.createElement('th');
  th.textContent = col.label;
  if(col.num) th.classList.add('num');
  if(col.sortable !== false){
    th.addEventListener('click', ()=>{
      if(state.sortKey === col.key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = col.key; state.sortDir = 'desc'; }
      render();
    });
  }
  th.dataset.key = col.key;
  headerRow.appendChild(th);
});

  const key = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
  return list.slice().sort((a,b)=>{
    let av, bv;
    if(key === 'org' || key === 'route'){ av=a[key]; bv=b[key]; return dir * av.localeCompare(bv); }
    if(key === 'pct'){ av = a.total? (a.updatable/a.total):0; bv = b.total? (b.updatable/b.total):0; }
    else if(CATEGORIES.includes(key)){ av = a.catTotals[key]; bv = b.catTotals[key]; }
    else { av = a[key]; bv = b[key]; }
    return dir * (av - bv);
  });
}

function render(){
  // legend active state
  Array.from(legend.children).forEach(chip=>{
    chip.classList.toggle('active', state.activeCats.has(chip.dataset.cat));
  });
  // header sort indicator
  Array.from(headerRow.children).forEach(th=>{
    th.classList.toggle('sort-active', th.dataset.key === state.sortKey);
    th.innerHTML = th.textContent.replace(/[▲▼]\s*$/,'');
    if(th.dataset.key === state.sortKey){
      th.innerHTML += ` <span class="arrow">${state.sortDir==='asc' ? '▲':'▼'}</span>`;
    }
  });

  const filteredRaw = RAW.filter(rawRowMatchesFilters);
  const filtered = sortGroups(buildGroups(filteredRaw));
  const body = document.getElementById('matrixBody');
  const emptyState = document.getElementById('emptyState');
  body.innerHTML = '';

  if(filtered.length === 0){
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    filtered.forEach(g=>{
      const tr = document.createElement('tr');
      const key = g.org + '\u0001' + g.route;
      if(state.expanded.has(key)) tr.classList.add('expanded');

      const pct = g.total ? Math.round((g.updatable/g.total)*100) : 0;

      const stackSegs = CATEGORIES.filter(c=>g.catTotals[c]>0).map(c=>{
        const w = (g.catTotals[c]/g.total*100).toFixed(2);
        return `<span style="width:${w}%;background:${CAT_COLOR[c]}" title="${c}: ${g.catTotals[c]}"></span>`;
      }).join('');
      const catCountsHtml = CATEGORIES.filter(c=>g.catTotals[c]>0).map(c=>{
        return `<span class="item"><span class="dot" style="background:${CAT_COLOR[c]}"></span>${g.catTotals[c]}</span>`;
      }).join('');

      tr.innerHTML = `
        <td class="org">${g.org}</td>
        <td class="route">${g.route}</td>
        <td class="bar-cell">
          <div class="stackbar">${stackSegs}</div>
          <div class="cat-counts">${catCountsHtml}</div>
        </td>
        ${CATEGORIES.map(c=>`<td class="num">${g.catTotals[c] || '–'}</td>`).join('')}
        <td class="num"><strong>${g.total}</strong></td>
        <td class="num">${pct}%</td>
      `;
      tr.addEventListener('click', ()=>{
        if(state.expanded.has(key)) state.expanded.delete(key);
        else state.expanded.add(key);
        render();
      });
      body.appendChild(tr);

      if(state.expanded.has(key)){
        const detailTr = document.createElement('tr');
        detailTr.className = 'detail-row';
        const td = document.createElement('td');
        td.colSpan = columns.length;
        td.appendChild(buildDetail(g));
        detailTr.appendChild(td);
        body.appendChild(detailTr);
      }
    });
  }

  renderTotals(filtered);
  document.getElementById('exportBtn').disabled = filtered.length === 0;
  document.getElementById('footnote').textContent =
    `Showing ${filtered.length} of ${GROUPS.length} org / route combinations · ${RAW.length} source rows from SPT_Use_cases.xlsx.`;
}

function buildDetail(g){
  const wrap = document.createElement('div');
  wrap.className = 'detail-inner';
  const table = document.createElement('table');
  table.className = 'legs';
  table.innerHTML = `
    <thead>
      <tr>
        <th>Leg(s)</th>
        <th>Category</th>
        <th class="num">Updatable</th>
        <th class="num">Not updatable</th>
        <th class="num">Total</th>
        <th>Agreement numbers</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');
  g.legs
    .slice()
    .sort((a,b)=> b.total - a.total)
    .forEach(l=>{
      const tr = document.createElement('tr');
      const showN = 8;
      const nums = l.agreements;
      const shown = nums.slice(0, showN).join(', ');
      const more = nums.length > showN ? nums.length - showN : 0;
      const listId = 'agr-' + Math.random().toString(36).slice(2);
      tr.innerHTML = `
        <td>${l.legs}</td>
        <td><span class="cat-pill"><span class="dot" style="background:${CAT_COLOR[l.category]}"></span>${l.category}</span></td>
        <td class="num">${l.updatable}</td>
        <td class="num">${l.not_updatable}</td>
        <td class="num"><strong>${l.total}</strong></td>
        <td class="agr-list">
          <span id="${listId}-short">${shown}${more? ` <span class="agr-toggle" data-target="${listId}">+${more} more</span>`:''}</span>
          <span id="${listId}-full" style="display:none;">${nums.join(', ')} <span class="agr-toggle" data-target="${listId}" data-collapse="1">show less</span></span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  wrap.appendChild(table);

  wrap.addEventListener('click', (e)=>{
    if(e.target.classList.contains('agr-toggle')){
      e.stopPropagation();
      const id = e.target.dataset.target;
      const shortEl = document.getElementById(id+'-short');
      const fullEl = document.getElementById(id+'-full');
      if(e.target.dataset.collapse){
        shortEl.style.display = '';
        fullEl.style.display = 'none';
      } else {
        shortEl.style.display = 'none';
        fullEl.style.display = '';
      }
    }
  });

  return wrap;
}

// ---- Export currently filtered data to Excel ----
function rawRowMatchesFilters(r){
  if(state.org && r.org !== state.org) return false;
  if(state.route && r.routes !== state.route) return false;
  if(state.leg && !atomicLegs(r.legs).includes(state.leg)) return false;
  if(state.search){
    const hay = (r.org + ' ' + r.routes + ' ' + r.legs).toLowerCase();
    if(!hay.includes(state.search)) return false;
  }
  if(state.activeCats.size > 0 && !state.activeCats.has(r.category)) return false;
  return true;
}

function exportFiltered(){
  const rows = RAW.filter(rawRowMatchesFilters);
  if(rows.length === 0){
    alert('No rows match the current filters — nothing to export.');
    return;
  }
  const sheetData = rows.map(r=>({
    'Org': r.org,
    'Route': r.routes,
    'Leg(s)': r.legs,
    'Category': r.category,
    'Updatable': r.updatable,
    'Not updatable': r.not_updatable,
    'Total': r.total,
    'Pct updatable': r.pct_updatable,
    'Agreement numbers': r.agreements.join(', ')
  }));
  const ws = XLSX.utils.json_to_sheet(sheetData);
  ws['!cols'] = [
    {wch:8},{wch:14},{wch:10},{wch:20},{wch:11},{wch:13},{wch:8},{wch:13},{wch:60}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Filtered agreements');

  const parts = [];
  if(state.org) parts.push(state.org);
  if(state.route) parts.push(state.route);
  if(state.leg) parts.push(state.leg);
  if(state.activeCats.size) parts.push(Array.from(state.activeCats).join('-'));
  const suffix = parts.length ? '_' + parts.join('_').replace(/[^a-z0-9\-]+/gi,'') : '';
  XLSX.writeFile(wb, `spt_agreements_filtered${suffix}.xlsx`);
}

document.getElementById('exportBtn').addEventListener('click', exportFiltered);

function renderTotals(filtered){
  const totalsEl = document.getElementById('totals');
  const totalAgreements = filtered.reduce((s,g)=>s+g.total,0);
  const totalUpdatable = filtered.reduce((s,g)=>s+g.updatable,0);
  const pct = totalAgreements ? Math.round(totalUpdatable/totalAgreements*100) : 0;
  const orgCount = new Set(filtered.map(g=>g.org)).size;
  const routeCount = new Set(filtered.map(g=>g.route)).size;

  totalsEl.innerHTML = `
    <div class="stat"><div class="n">${totalAgreements}</div><div class="l">Agreements</div></div>
    <div class="stat"><div class="n">${orgCount}</div><div class="l">Orgs</div></div>
    <div class="stat"><div class="n">${routeCount}</div><div class="l">Routes</div></div>
    <div class="stat"><div class="n">${pct}%</div><div class="l">Updatable</div></div>
  `;
}

render();
</script>
</body>
</html>
